<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf953f"/>
      <stop offset="25%" stop-color="#fcf6ba"/>
      <stop offset="50%" stop-color="#b38728"/>
      <stop offset="75%" stop-color="#fbf5b7"/>
      <stop offset="100%" stop-color="#aa771c"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Crimson Glow Gradient -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Radial ambient glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d4af37" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#centerGlow)"/>

  <!-- Geometric Arabesque Border -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.4">
    <rect x="20" y="20" width="1160" height="360" rx="8"/>
    <rect x="28" y="28" width="1144" height="344" rx="6" stroke-dasharray="6,4"/>
    
    <!-- Corner Ornaments -->
    <!-- Top Left -->
    <path d="M 20 60 L 60 20 M 20 80 L 80 20 M 28 48 L 48 28"/>
    <!-- Top Right -->
    <path d="M 1180 60 L 1140 20 M 1180 80 L 1120 20 M 1172 48 L 1152 28"/>
    <!-- Bottom Left -->
    <path d="M 20 340 L 60 380 M 20 320 L 80 380 M 28 352 L 48 372"/>
    <!-- Bottom Right -->
    <path d="M 1180 340 L 1140 380 M 1180 320 L 1120 380 M 1172 352 L 1152 372"/>
  </g>

  <!-- Dialectic Pole Badges (Green / Red Yin-Yang Concept) -->
  <!-- Left Pole: Al-Mahasin (Virtues) -->
  <g transform="translate(180, 80)">
    <circle cx="0" cy="0" r="32" fill="url(#emeraldGrad)" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="8" font-family="'Amiri', 'Traditional Arabic', serif" font-size="22" font-weight="bold" fill="#ecfdf5" text-anchor="middle">المحاسن</text>
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="2">THESIS • ÖVGÜ</text>
  </g>

  <!-- Right Pole: Al-Addad / Al-Masawi (Contraries) -->
  <g transform="translate(1020, 80)">
    <circle cx="0" cy="0" r="32" fill="url(#rubyGrad)" stroke="#ef4444" stroke-width="2"/>
    <text x="0" y="8" font-family="'Amiri', 'Traditional Arabic', serif" font-size="22" font-weight="bold" fill="#fef2f2" text-anchor="middle">الأضداد</text>
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle" letter-spacing="2">ANTITHESIS • YERGİ</text>
  </g>

  <!-- Center Classical Arabic Calligraphy Title -->
  <text x="600" y="145" font-family="'Amiri', 'Scheherazade New', 'Traditional Arabic', serif" font-size="62" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldShadow)" letter-spacing="2">
    كِتَابُ المَحَاسِنِ وَالأَضْدَادِ
  </text>

  <!-- Latin Main Title -->
  <text x="600" y="210" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="8">
    EL-MEHÂSİN VE'L-EZDÂD
  </text>

  <!-- Subtitle / Tagline -->
  <text x="600" y="250" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#9ca3af" text-anchor="middle" letter-spacing="3">
    CLASSICAL ARABIC BIPOLAR DIALECTIC &amp; RHETORICAL CORPUS
  </text>

  <!-- Decorative Separator Line -->
  <g transform="translate(600, 280)">
    <line x1="-220" y1="0" x2="220" y2="0" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#d4af37"/>
    <circle cx="-100" cy="0" r="3" fill="#d4af37"/>
    <circle cx="100" cy="0" r="3" fill="#d4af37"/>
  </g>

  <!-- Badges / Tags at the bottom -->
  <g transform="translate(600, 335)" font-family="'Inter', 'Segoe UI', sans-serif" font-size="12" font-weight="500">
    <!-- Tag 1 -->
    <rect x="-380" y="-15" width="160" height="30" rx="15" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="-300" y="5" fill="#e5e7eb" text-anchor="middle">🏛️ Pseudo-Câhiz / Beyhakî</text>

    <!-- Tag 2 -->
    <rect x="-190" y="-15" width="170" height="30" rx="15" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="-105" y="5" fill="#e5e7eb" text-anchor="middle">⚖️ 10+ Diyalektik Kutup</text>

    <!-- Tag 3 -->
    <rect x="10" y="-15" width="170" height="30" rx="15" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="95" y="5" fill="#e5e7eb" text-anchor="middle">📜 Klasik Şevâhid &amp; Şerh</text>

    <!-- Tag 4 -->
    <rect x="210" y="-15" width="170" height="30" rx="15" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="295" y="5" fill="#e5e7eb" text-anchor="middle">🤖 NLP &amp; Hugging Face</text>
  </g>
</svg>