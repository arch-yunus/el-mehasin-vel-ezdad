<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="40%" stop-color="#0e172a"/>
      <stop offset="70%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="20%" stop-color="#f5e08c"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="60%" stop-color="#fff8db"/>
      <stop offset="80%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Crimson Glow -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="auroraGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070b14" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="440" fill="url(#mainBg)"/>
  <rect width="1280" height="440" fill="url(#auroraGlow)"/>

  <!-- Geometric Arabesque Lattice Frame -->
  <g stroke="url(#goldMetallic)" stroke-width="1.5" fill="none" opacity="0.45">
    <rect x="24" y="24" width="1232" height="392" rx="14"/>
    <rect x="34" y="34" width="1212" height="372" rx="10" stroke-dasharray="8,5"/>
    
    <!-- Corner Ornaments -->
    <path d="M 24 74 L 74 24 M 24 94 L 94 24 M 34 58 L 58 34"/>
    <path d="M 1256 74 L 1206 24 M 1256 94 L 1186 24 M 1246 58 L 1222 34"/>
    <path d="M 24 366 L 74 416 M 24 346 L 94 416 M 34 382 L 58 406"/>
    <path d="M 1256 366 L 1206 416 M 1256 346 L 1186 416 M 1246 382 L 1222 406"/>
  </g>

  <!-- Left Dialectic Pole (Al-Mahasin / Virtues) -->
  <g transform="translate(180, 100)">
    <circle cx="0" cy="0" r="38" fill="url(#emeraldGrad)" stroke="#10b981" stroke-width="2.5" filter="url(#goldGlow)"/>
    <text x="0" y="10" font-family="'Amiri', 'Traditional Arabic', serif" font-size="24" font-weight="bold" fill="#ecfdf5" text-anchor="middle">المَحَاسِن</text>
    <text x="0" y="58" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="2">THESIS • ÖVGÜ</text>
    <text x="0" y="76" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">İki Kutuplu Fazilet</text>
  </g>

  <!-- Right Dialectic Pole (Al-Addad / Contraries) -->
  <g transform="translate(1100, 100)">
    <circle cx="0" cy="0" r="38" fill="url(#crimsonGrad)" stroke="#f43f5e" stroke-width="2.5" filter="url(#goldGlow)"/>
    <text x="0" y="10" font-family="'Amiri', 'Traditional Arabic', serif" font-size="24" font-weight="bold" fill="#fff1f2" text-anchor="middle">الأَضْدَاد</text>
    <text x="0" y="58" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle" letter-spacing="2">ANTITHESIS • YERGİ</text>
    <text x="0" y="76" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">Bağlamsal İtiraz</text>
  </g>

  <!-- Center Classical Title -->
  <text x="640" y="155" font-family="'Amiri', 'Scheherazade New', 'Traditional Arabic', serif" font-size="66" font-weight="bold" fill="url(#goldMetallic)" text-anchor="middle" filter="url(#goldGlow)" letter-spacing="2">
    كِتَابُ المَحَاسِنِ وَالأَضْدَادِ
  </text>

  <!-- Latin Title -->
  <text x="640" y="222" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="9">
    EL-MEHÂSİN VE'L-EZDÂD
  </text>

  <!-- Subtitle -->
  <text x="640" y="264" font-family="'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="3">
    KLASİK ARAP EDEBİYATINDA İKİ KUTUPLU MANTIK &amp; HESAPLAMALI RETORİK KÜLLİYATI
  </text>

  <!-- Decorative Separator -->
  <g transform="translate(640, 296)">
    <line x1="-280" y1="0" x2="280" y2="0" stroke="url(#goldMetallic)" stroke-width="1.5"/>
    <polygon points="0,-7 7,0 0,7 -7,0" fill="#d4af37"/>
    <circle cx="-140" cy="0" r="3.5" fill="#d4af37"/>
    <circle cx="140" cy="0" r="3.5" fill="#d4af37"/>
  </g>

  <!-- Feature Badges on Banner -->
  <g transform="translate(640, 355)">
    <!-- Badge 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">⚖️ 20 Diyalektik Kutup</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(-120, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">📜 81+ Şiir Şahidi</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(120, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🐍 Python SDK v1.1.0</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">🤖 LLM Benchmark</text>
    </g>
  </g>
</svg>