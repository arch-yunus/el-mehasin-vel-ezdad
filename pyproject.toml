[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "el-mehasin-vel-ezdad"
version = "1.0.0"
authors = [
  { name="Bahattin Yunus ÇETİN", email="bahattinyunuscetin@hotmail.com" },
]
description = "Classical Arabic Bipolar Dialectic, Adab & Rhetoric Research Corpus"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
el-mehasin = "el_mehasin.cli:main"
