<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>el-Mehâsin ve'l-Ezdâd | İki Kutuplu Diyalektik Korpus Gezgini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0f1d;
      --card-bg: #111827;
      --card-border: #1f2937;
      --accent-gold: #d4af37;
      --thesis-green: #10b981;
      --thesis-bg: rgba(16, 185, 129, 0.08);
      --antithesis-red: #ef4444;
      --antithesis-bg: rgba(239, 68, 68, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }
    header {
      background: linear-gradient(180deg, #111827 0%, #0a0f1d 100%);
      border-bottom: 1px solid var(--card-border);
      padding: 40px 20px;
      text-align: center;
    }
    .arabic-title {
      font-family: 'Amiri', serif;
      font-size: 2.8rem;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }
    .sub-title {
      font-size: 1.1rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      flex: 1;
      min-width: 280px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
    }
    .stats-badge {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .pairs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .pair-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 24px;
      transition: transform 0.2s, border-color 0.2s;
    }
    .pair-card:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .pair-id {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .arabic-topic {
      font-family: 'Amiri', serif;
      font-size: 1.4rem;
      color: #e5e7eb;
    }
    .dialectic-panes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 768px) {
      .dialectic-panes { grid-template-columns: 1fr; }
    }
    .pane {
      padding: 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .thesis-pane {
      background: var(--thesis-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .antithesis-pane {
      background: var(--antithesis-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .pane-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .thesis-title { color: var(--thesis-green); }
    .antithesis-title { color: var(--antithesis-red); }
    .premise {
      font-size: 0.95rem;
      color: #d1d5db;
      margin-bottom: 16px;
    }
    .quote-box {
      background: rgba(0,0,0,0.3);
      padding: 14px;
      border-radius: 8px;
      border-left: 3px solid #6b7280;
    }
    .arabic-quote {
      font-family: 'Amiri', serif;
      font-size: 1.25rem;
      direction: rtl;
      color: #fef08a;
      margin-bottom: 8px;
      line-height: 1.8;
    }
    .turkish-quote {
      font-size: 0.9rem;
      color: #9ca3af;
      font-style: italic;
    }
    .source-tag {
      font-size: 0.8rem;
      color: var(--accent-gold);
      font-weight: 600;
      margin-top: 6px;
      display: block;
    }
    .synthesis-bar {
      background: #1f2937;
      padding: 16px 20px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-gold);
      font-size: 0.95rem;
    }
    .synthesis-label {
      font-weight: 700;
      color: var(--accent-gold);
      margin-right: 8px;
    }
    .devices-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }
    .device-badge {
      background: #374151;
      color: #e5e7eb;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="arabic-title">كِتَابُ المَحَاسِنِ وَالأَضْدَادِ</h1>
    <p class="sub-title">Klasik Arap Adab Külliyatı İki Kutuplu Diyalektik Korpus Gezgini</p>
  </header>

  <div class="container">
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Kavram, başlık veya retorik sanat ara... (örn: samt, cömertlik, tıbâk)">
      </div>
      <div class="stats-badge" id="statsBadge">Yükleniyor...</div>
    </div>

    <div class="pairs-grid" id="pairsGrid"></div>
  </div>

  <script>
    let corpusData = [];

    async function loadData() {
      try {
        const response = await fetch('../data/dialectic_pairs.jsonl');
        const text = await response.text();
        corpusData = text.trim().split('\n').filter(l => l.trim()).map(l => JSON.parse(l));
        document.getElementById('statsBadge').textContent = `${corpusData.length} Diyalektik Kutup`;
        renderPairs(corpusData);
      } catch (err) {
        console.error('Veri yüklenirken hata:', err);
      }
    }

    function renderPairs(data) {
      const grid = document.getElementById('pairsGrid');
      grid.innerHTML = '';

      if (data.length === 0) {
        grid.innerHTML = '<p style="text-align:center; color:#9ca3af; padding:40px;">Eşleşen diyalektik kayıt bulunamadı.</p>';
        return;
      }

      data.forEach(p => {
        const card = document.createElement('div');
        card.className = 'pair-card';

        const devices = (p.metadata?.rhetorical_devices || []).map(d => `<span class="device-badge">${d}</span>`).join('');

        card.innerHTML = `
          <div class="card-header">
            <span class="pair-id">${p.entry_id}</span>
            <span class="arabic-topic">${p.classical_arabic_title}</span>
          </div>
          <div class="dialectic-panes">
            <div class="pane thesis-pane">
              <div>
                <h3 class="pane-title thesis-title">🟢 TEZ: ${p.thesis.concept}</h3>
                <p class="premise">${p.thesis.core_premise}</p>
              </div>
              <div class="quote-box">
                <div class="arabic-quote">${p.thesis.top_quote.arabic}</div>
                <div class="turkish-quote">"${p.thesis.top_quote.turkish}"</div>
                <span class="source-tag">📌 ${p.thesis.top_quote.source}</span>
              </div>
            </div>

            <div class="pane antithesis-pane">
              <div>
                <h3 class="pane-title antithesis-title">🔴 ANTİTEZ: ${p.antithesis.concept}</h3>
                <p class="premise">${p.antithesis.core_premise}</p>
              </div>
              <div class="quote-box">
                <div class="arabic-quote">${p.antithesis.top_quote.arabic}</div>
                <div class="turkish-quote">"${p.antithesis.top_quote.turkish}"</div>
                <span class="source-tag">📌 ${p.antithesis.top_quote.source}</span>
              </div>
            </div>
          </div>

          <div class="synthesis-bar">
            <span class="synthesis-label">⚖️ SENTEZ (İTİDAL):</span>
            <span>${p.dialectic_synthesis}</span>
          </div>

          <div class="devices-tags">
            ${devices}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = corpusData.filter(p => {
        const searchable = `${p.entry_id} ${p.topic_slug} ${p.classical_arabic_title} ${p.thesis.concept} ${p.thesis.core_premise} ${p.antithesis.concept} ${p.antithesis.core_premise} ${p.dialectic_synthesis} ${(p.metadata?.rhetorical_devices || []).join(' ')}`.toLowerCase();
        return searchable.includes(q);
      });
      renderPairs(filtered);
    });

    loadData();
  </script>
</body>
</html>
